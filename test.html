<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>報告文ツール</title>
  <style>
    :root {
      --bg: #f2f2f2;          /* ページ全体の背景 */
      --surface: #ffffff;     /* 入力欄・プレビューの背景 */
      --text: #222222;        /* 文字の色 */
      --sub: #666666;         /* 項目名などの控えめな文字 */
      --border: #bdbdbd;      /* 枠線 */
      --accent: #333333;      /* ボタン・フォーカスの色 */
      --radius: 6px;            /* 入力欄・プレビューの角丸 */
    }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 560px;
      margin: 0 auto;
      padding: 16px;
      line-height: 1.6;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 16px;
    }

    h2 {
      font-size: 15px;
      margin: 20px 0 6px;
      color: var(--sub);
    }

    p {
      font-size: 13px;
      margin: 0 0 10px;
      color: var(--sub);
    }

    a {
      font-size: 15px;
      margin-top: 30px;
      color: var(--accent);
      text-decoration: underline;
    }

    label {
      display: block;
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--sub);
    }

    #fields br {
      display: none;
    }

    /* JSが入れている改行は不要になるので消す */

    /* 入力まわりの共通設定 */
    input,
    select,
    textarea,
    button {
      font-family: inherit;
      font-size: 16px;
      padding: 10px 14px;
      box-sizing: border-box;
      width: 100%;
      color: var(--text);
    }

    input,
    textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-top: 4px;
    }

    select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 18px;
      margin: 4px 0 12px;
    }

    ::placeholder {
      color: #a8a8a8;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    #preview {
      font-family: inherit;
      font-size: 15px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin: 0 0 16px;
      min-height: 4em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* コピーボタン */
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }

    button:active {
      background: #000;
    }

    /* 白地のリンクボタン */
    .linkBtn {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin-top: 12px;
      padding: 10px 14px;
      text-align: center;
      font-size: 16px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 999px;
      text-decoration: none;
    }

    .linkBtn:active {
      background: var(--bg);
    }
  </style>
</head>

<body>
  <h1>報告文ツール</h1>

  <!-- ① トラブル（選択肢はJSで作る） -->
  <div>トラブル：<select id="genre"></select></div>

  <!-- ② 状態（選択肢はJSで作る。状態が1つだけのジャンルでは隠す） -->
  <div id="stateRow">状態：<select id="state"></select></div>

  <!-- ③ 入力欄（JSで作る） -->
  <div id="fields"></div>

  <!-- ④ プレビュー（入力に合わせて自動で更新される） -->
  <h2>プレビュー</h2>
  <p>一行目に"//"で始まるコメントがある場合は、その指示に従ってください。<br>
    送信時にはコメントを削除してください。</p>
  <pre id="preview"></pre>

  <button id="copyBtn">コピー</button>

  <a class="linkBtn" href="https://forms.gle/e5fLnTpf4tsDRYRL8" target="_blank" rel="noopener">不具合報告・改善要望フォーム</a>

  <script>

    // サービスワーカーの登録
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }

    // ===== データ（ここを書き換えれば、ジャンル・状態・項目が変わる） =====

    // タイトルの区切り文字（【迷子＿親が探している】の「＿」）
    const SEP = "_";

    // ジャンル → 状態 → 内容 の一覧表
    //   title       : タイトルの部品。"{品物}" と書くと、入力された品物がそこに入る
    //   titleFields : タイトルにだけ使う入力欄（本文の行には出ない）
    //   fields      : 「項目：入力」の行になる入力欄
    //   fixed       : 「項目：決まった文章」の行（入力不要）
    //   freeText    : 項目名なしで、そのまま出す自由入力欄の名前
    //   closing     : 最後に付ける決まった一文
    const genres = {
      "落とし物": {
        "発見（取得）": {
          comments: "// 写真を添付",
          title: ["落とし物", "取得", "{品物}"],
          titleFields: ["品物"],
          fields: ["場所"]
        },
        "問い合わせ（捜索）": {
          comments: "// @岩瀬 をメンション",
          title: ["落とし物", "捜索", "{品物}"],
          titleFields: ["品物"],
          freeText: "状況",
          closing: "本部にご案内します。"
        }
      },
      "迷子": {
        "親が探している": {
          comments: "// @岩瀬、@ぴ をメンション",
          title: ["迷子", "親が探している"],
          fields: ["子供の名前", "服装"],
          closing: "見つけたら報告をお願いします。"
        },
        "子供が探している": {
          comments: "// @岩瀬、@ぴ をメンション",
          title: ["迷子", "子供が探している"],
          fields: ["子供の名前", "服装", "同伴者", "特徴"],
          closing: "見つけたら報告をお願いします。"
        }
      },
      "けが人": {
        "意識有": {
          comments: "// @岩瀬、@ぴ をメンション",
          title: ["けが人", "意識有", "{負傷内容}"],
          titleFields: ["負傷内容"],
          fields: ["場所"],
          freeText: "補足"
        },
        "意識なし": {
          comments: "// @岩瀬、@ぴ をメンション",
          title: ["けが人", "意識なし", "{負傷内容}"],
          titleFields: ["負傷内容"],
          fields: ["場所"],
          freeText: "補足"
        }
      },
      "体調不良者": {
        "意識有": {
          comments: "// @岩瀬、@ぴ をメンション",
          title: ["体調不良者", "意識有", "{症状}"],
          titleFields: ["症状"],
          fields: ["場所"],
          freeText: "補足"
        },
        "意識なし": {
          comments: "// @岩瀬、@ぴ をメンション",
          title: ["体調不良者", "意識なし", "{症状}"],
          titleFields: ["症状"],
          fields: ["場所"],
          freeText: "補足"
        }
      },
      "クレーマー": {
        "報告": {
          comments: "// @岩瀬 をメンション",
          title: ["クレーマー"],
          fields: ["背丈", "服装", "位置", "上回生"]
        }
      },
      "不審者": {
        "報告": {
          comments: "// @岩瀬 をメンション",
          title: ["不審者"],
          fields: ["背丈", "服装", "位置", "年齢"]
        }
      }
    };

    // 入力欄に薄く表示する例文（項目名 → 例文）
    const EXAMPLES = {
      "品物": "ミントグリーンの財布",
      "場所": "ステージ後方再入場口付近",
      "状況": "水色のハンカチをなくした女性がいます。最後に見たのはビンゴ受付待機列だそうです。",
      "子供の名前": "はるかちゃん(５)女の子",
      "服装": "茶色いワンピースに高めのお団子",
      "同伴者": "母親",
      "特徴": "黒いコートに白いシュシュで横結び",
      "負傷内容": "骨折",
      "補足": "「動けない」そうなので、担架での保健室への案内をお願いします。",
      "症状": "腹痛",
      "詳細": "AED、救急車対応を行います。",
      "背丈": "中肉中背",
      "位置": "景品付近",
      "上回生": "いない",
      "年齢": "中年男性",
    };

    // ===== 文章をつくる関数 =====

    // values は { 項目名: 入力された文字 } の形
    function makeText(genre, state, values) {
      const data = genres[genre][state];
      const fixed = data.fixed || {};
      const lines = [];

      if (data.comments) {
        lines.push(data.comments);
      }

      // 1行目：タイトル（"{品物}" の部分を入力値に置き換える）
      const parts = data.title.map(function (part) {
        if (part.startsWith("{")) {
          return values[part.slice(1, -1)];
        }
        return part;
      });
      lines.push(`【${parts.join(SEP)}】`);

      // 「項目：入力」の行。コロンの位置をそろえるため、
      // いちばん長い項目名に合わせて全角スペースで埋める
      const labels = (data.fields || []).concat(Object.keys(fixed));
      let width = 0;
      for (const label of labels) {
        if (label.length > width) width = label.length;
      }
      for (const label of labels) {
        const value = (label in fixed) ? fixed[label] : values[label];
        const pad = "　".repeat(width - label.length);
        lines.push(`${label}${pad}：${value}`);
      }

      // 自由入力欄（項目名なし）
      if (data.freeText) {
        lines.push(values[data.freeText]);
      }

      // 締めの一文
      if (data.closing) {
        lines.push(data.closing);
      }

      return lines.join("\n");
    }

    // ===== 画面の処理 =====

    const select = document.getElementById("genre");
    const stateSelect = document.getElementById("state");
    const stateRow = document.getElementById("stateRow");
    const fieldsDiv = document.getElementById("fields");
    const copyBtn = document.getElementById("copyBtn");
    const preview = document.getElementById("preview");

    // 入力欄の中身を集めて、文章にして返す
    function getText() {
      const values = {};
      for (const el of fieldsDiv.querySelectorAll("input, textarea")) {
        values[el.dataset.label] = el.value;
      }
      return makeText(select.value, stateSelect.value, values);
    }

    // プレビューを今の文章に更新する
    function updatePreview() {
      preview.textContent = getText();
    }

    // ジャンルの選択肢をつくる
    for (const g of Object.keys(genres)) {
      select.innerHTML += `<option>${g}</option>`;
    }

    // 選ばれたジャンルの状態の選択肢をつくる
    function showStates() {
      stateSelect.innerHTML = "";
      const states = Object.keys(genres[select.value]);
      for (const s of states) {
        stateSelect.innerHTML += `<option>${s}</option>`;
      }
      // 状態が1つだけなら、選ぶ必要がないので隠す
      stateRow.hidden = (states.length === 1);
    }

    // 選ばれたジャンル＋状態の入力欄をつくる
    function showFields() {
      fieldsDiv.innerHTML = "";
      const data = genres[select.value][stateSelect.value];

      const labels = (data.titleFields || []).concat(data.fields || []);
      for (const f of labels) {
        fieldsDiv.innerHTML += `<label>${f}：<input data-label="${f}" placeholder="${EXAMPLES[f] || ""}"></label><br>`;
      }
      if (data.freeText) {
        fieldsDiv.innerHTML +=
          `<label>${data.freeText}：<br><textarea data-label="${data.freeText}" rows="4" placeholder="${EXAMPLES[data.freeText] || ""}"></textarea></label><br>`;
      }
      updatePreview();
    }

    // ジャンルが変わったら：状態を入れ替えて、そのあと入力欄
    select.addEventListener("change", function () {
      showStates();
      showFields();
    });

    // 状態が変わったら：入力欄だけ作り直す
    stateSelect.addEventListener("change", showFields);

    // 入力欄に文字を打つたびに：プレビューを更新
    fieldsDiv.addEventListener("input", updatePreview);

    // ページを開いた直後
    showStates();
    showFields();

    // ボタンが押されたら、文章をつくってコピーする
    copyBtn.addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(getText());
        copyBtn.textContent = "コピーしました ✓";
      } catch (e) {
        copyBtn.textContent = "コピーできませんでした";
      }
      setTimeout(function () {
        copyBtn.textContent = "コピー";
      }, 1500);
    });
  </script>
</body>

</html>
